[platformio]
default_envs = esp32s3

; Firmware settings (ESP32-S3 only). Platform is pinned so local and CI builds
; match: pioarduino 55.03.312-1 = Arduino-ESP32 3.3.12 on ESP-IDF 5.5.5.
; Zip SHA-256 f147d4ec6d657f451742df497811ebe3377db583ffd2e321e34b3793ff6b20a2
; (checked when the pin was set; Dependabot can't update URL platforms, so bump by hand).
[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; The Arduino core hard-codes gnu++11; we use C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DFW_VERSION=\"0.2.8\"
    ; Arduino WebServer busy-waits while a request trickles in: keep it short so one
    ; slow client can't hold the dashboard for 10 s (it can no longer reset the board;
    ; see webTask in src/main.cpp).
    -DWEBSERVER_MAX_LINE_WAIT=2000
    -DWEBSERVER_MAX_HEADER_WAIT=4000
; Our own sources only (not the Arduino core); lib/core gets the same via library.json.
build_src_flags =
    -Wall
    -Wextra

; Target: Guition JC4827W543C (ESP32-S3 N16R8, 480x272 QSPI NV3041A + GT911 touch).
; Same flash/PSRAM specs as the DevKitC-1 N16R8; memory_type MUST be qio_opi.
[env:esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
board_build.partitions = partitions_4MB.csv
lib_deps =
    lvgl/lvgl@^9.2.2
    moononournation/GFX Library for Arduino@^1.4.9
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -I$PROJECT_DIR
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Hardware self-test build, never released: adds POST /api/selftest?hang=<what> (logged
; in) that hangs one task on purpose, with short software-watchdog limits, to check on
; the board that every hang ends in a restart with its reason (skill debugging).
[env:esp32s3_selftest]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DADBLOCK_SELFTEST

; Host-side unit tests for lib/core (no hardware). Run: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Itest
    ; Linux GCC (CI) predefines `unix`/`linux` as macros in gnu++ mode; mirror that on
    ; macOS so a variable named `unix` fails locally too.
    -Dunix=1
    -Dlinux=1
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -fno-sanitize-recover=all
extra_scripts = post:tools/native_link_flags.py

; Native tests with coverage instrumentation (no sanitizers). Run: tools/coverage.sh
[env:coverage]
extends = env:native
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -Itest
    -Dunix=1
    -Dlinux=1
    -O0
    -g
    --coverage
    ; Thread-safe counters: test_blocklist runs concurrent readers, and GCC's default
    ; (non-atomic) counters then produce negative hit counts that gcovr rejects.
    -fprofile-update=atomic
